name: Build CloudStream Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout cloudstream template
        uses: actions/checkout@v4
        with:
          repository: recloudstream/cloudstream-plugin-template
          path: template

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare template
        run: |
          rm -rf template/app/src/main/java/com/example
          cp -r plugin/WatchAnimeWorld template/app/

          # Patch settings.gradle.kts for JitPack master-SNAPSHOT issue
          SETTINGS=template/settings.gradle.kts
          echo "=== ORIGINAL ==="
          cat "$SETTINGS"
          echo ""

          python3 - <<'PYEOF'
          import re
          path = "template/settings.gradle.kts"
          with open(path) as f:
              content = f.read()

          jitpack_block = '''maven("https://jitpack.io") {
              content {
                  includeGroup("com.github.recloudstream")
              }
              metadataSources {
                  gradleMetadata()
                  mavenPom()
                  artifact()
              }
          }'''

          content = re.sub(r'maven\\(["\']https://jitpack\\.io["\']\\)', jitpack_block, content)

          with open(path, "w") as f:
              f.write(content)
          PYEOF

          echo "=== PATCHED ==="
          cat "$SETTINGS"

      - name: Build .cs3
        run: |
          cd template
          chmod +x gradlew
          ./gradlew make --refresh-dependencies --stacktrace 2>&1 | tail -250

      - name: Copy output
        if: success()
        run: |
          mkdir -p plugin/builds
          find template -name "*.cs3" -exec cp {} plugin/builds/WatchAnimeWorld.cs3 \;
          ls -la plugin/builds/

      - name: Update plugins.json
        if: success()
        working-directory: plugin
        run: |
          FILE=builds/WatchAnimeWorld.cs3
          SIZE=$(stat -c%s "$FILE")
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          jq ".[0].fileSize = $SIZE | .[0].fileHash = \"$HASH\"" plugins.json > plugins.json.tmp
          mv plugins.json.tmp plugins.json

      - name: Commit builds
        if: success()
        working-directory: plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/ plugins.json
          git diff --staged --quiet || git commit -m "build: update cs3 + manifest"
          git push
