name: Build CloudStream Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone cloudstream plugin template
        run: |
          git clone --depth=1 https://github.com/recloudstream/cloudstream-plugin-template.git /tmp/template
          rm -rf /tmp/template/app/src/main/java/com/example
          cp -r WatchAnimeWorld /tmp/template/app/

      - name: Build .cs3
        run: |
          cd /tmp/template
          chmod +x gradlew
          ./gradlew make

      - name: Copy output
        run: |
          mkdir -p builds
          find /tmp/template -name "*.cs3" -exec cp {} builds/WatchAnimeWorld.cs3 \;
          ls -la builds/

      - name: Update plugins.json
        run: |
          FILE=builds/WatchAnimeWorld.cs3
          SIZE=$(stat -c%s "$FILE")
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          jq ".[0].fileSize = $SIZE | .[0].fileHash = \"$HASH\"" plugins.json > plugins.json.tmp
          mv plugins.json.tmp plugins.json

      - name: Commit builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/ plugins.json
          git diff --staged --quiet || git commit -m "build: update cs3 + manifest"
          git push
