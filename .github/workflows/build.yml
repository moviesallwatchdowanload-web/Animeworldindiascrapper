name: Build CloudStream Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GIT_TERMINAL_PROMPT: 0

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone cloudstream template + patch JitPack
        run: |
          git -c credential.helper= clone --depth=1 https://github.com/recloudstream/cloudstream-plugin-template.git /tmp/template
          rm -rf /tmp/template/app/src/main/java/com/example

          # Find and patch settings.gradle.kts — fix JitPack master-SNAPSHOT issue
          SETTINGS=/tmp/template/settings.gradle.kts
          if [ -f "$SETTINGS" ]; then
            echo "=== ORIGINAL settings.gradle.kts ==="
            cat "$SETTINGS"
            echo ""

            # Replace plain jitpack maven with metadata-source-filtered one
            python3 - <<'PYEOF'
          import re
          path = "/tmp/template/settings.gradle.kts"
          with open(path) as f:
              content = f.read()

          jitpack_block = '''maven("https://jitpack.io") {
              content {
                  includeGroup("com.github.recloudstream")
              }
              metadataSources {
                  gradleMetadata()
                  mavenPom()
                  artifact()
              }
          }'''

          content = re.sub(r'maven\\(["\']https://jitpack\\.io["\']\\)', jitpack_block, content)
          with open(path, "w") as f:
              f.write(content)
          PYEOF

            echo "=== PATCHED settings.gradle.kts ==="
            cat "$SETTINGS"
          fi

          # Also patch build.gradle.kts if it has master-SNAPSHOT directly
          find /tmp/template -name "build.gradle.kts" -exec sh -c '
            for f; do
              if grep -q "master-SNAPSHOT" "$f" 2>/dev/null; then
                echo "Patching: $f"
                sed -i "s|master-SNAPSHOT|main-SNAPSHOT|g" "$f"
              fi
            done
          ' sh {} +

          cp -r WatchAnimeWorld /tmp/template/app/

      - name: Build .cs3
        run: |
          cd /tmp/template
          chmod +x gradlew
          ./gradlew make --refresh-dependencies --stacktrace 2>&1 | tail -200

      - name: Copy output
        if: success()
        run: |
          mkdir -p builds
          find /tmp/template -name "*.cs3" -exec cp {} builds/WatchAnimeWorld.cs3 \;
          ls -la builds/

      - name: Update plugins.json
        if: success()
        run: |
          FILE=builds/WatchAnimeWorld.cs3
          SIZE=$(stat -c%s "$FILE")
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          jq ".[0].fileSize = $SIZE | .[0].fileHash = \"$HASH\"" plugins.json > plugins.json.tmp
          mv plugins.json.tmp plugins.json

      - name: Commit builds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/ plugins.json
          git diff --staged --quiet || git commit -m "build: update cs3 + manifest"
          git push
